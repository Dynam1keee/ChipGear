# Nginx site for ChipGear (React frontend + Django API).
# Copy to /etc/nginx/sites-available/chipgear, link it into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The built React app (npm run build)
    root /var/www/chipgear/frontend;
    index index.html;

    # Django: API and admin panel
    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin panel CSS and JS (collectstatic)
    location /static/ {
        alias /var/www/chipgear/static/;
        expires 7d;
    }

    # Product photos
    location /media/ {
        alias /var/www/chipgear/media/;
        expires 7d;
    }

    # Files built by Vite have a hash in the name, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a page of the React app (React Router decides what to show)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
